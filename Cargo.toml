[package]
name = "shredstream-py"
version = "2.0.1"
edition = "2021"
rust-version = "1.75"
description = "PyO3 bindings for the shredstream crate — ultra-low latency Solana shred streaming."
license = "MIT"
authors = ["ShredStream.com"]
repository = "https://github.com/shredstream/shredstream-sdk-python"
homepage = "https://shredstream.com"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py38"] }
shredstream = "2.0.0"
serde_json = "1"
bincode = "1.3"
solana-transaction = "3.0"
