[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "shredstream"
version = "2.0.1"
description = "Solana ShredStream SDK for Python — PyO3 bindings to the Rust core, ultra-low latency UDP shred streaming."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ShredStream.com" }]
dependencies = ["solders>=0.21"]
keywords = [
    "solana", "shredstream", "shred", "stream", "decoder", "parser",
    "transactions", "udp", "sdk", "mev", "hft", "bot", "defi",
    "sniping", "blockchain", "latency",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://shredstream.com"
Repository = "https://github.com/shredstream/shredstream-sdk-python"

# NOTE: x86_64 wheels link against `reed-solomon-erasure` with the
# `simd-accel` feature, which requires SSSE3 at runtime. Hosts older than
# Nehalem (2008) will not run these wheels — build from source instead.

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "shredstream._native"
python-source = "."
strip = true
